# Docker Compose configuration for a server, Node server, and two client services (Python and C++)
services:
  server:

    # Build the C++ server container from a Dockerfile
    build:
      context: ./src
      dockerfile: ServerCpp/Dockerfile

    entrypoint: ["./ServerCpp"]
    command: ["3782"]

    ports:
      - "3782:3782"

    volumes:
      - ./data:/usr/src/data 

    environment:
      - EX1_DIR=/usr/src/data 

    networks:
      - local

  server_node:            # <-- NEW: Node server
    build:
      context: ./src/nodejs    # folder where your app.js is
      dockerfile: Dockerfile   # Node Dockerfile
    ports:
      - "8080:3000"            # expose host port 8080 to container port 3000
    volumes:
      - ./src/nodejs:/usr/src/app
    networks:
      - local

  client_python:

    build:
      context: ./src/ClientPython
      dockerfile: Dockerfile

    entrypoint: ["python3", "TCP_Client.py"]
    command: ["172.28.0.2", "3782"]

    depends_on:
      - server
    networks:
      - local

    stdin_open: true   
    tty: true          

  client_cpp:

    build:
      context: ./src/ClientCpp
      dockerfile: Dockerfile

    entrypoint: ["./tcp_c"]
    command: ["172.28.0.2", "3782"]

    depends_on:
      - server
    networks:
      - local

    stdin_open: true  
    tty: true         

networks:
  local:
    driver: bridge
    ipam:
      config:
        - subnet: "172.28.0.0/16"
