services:

  # C++ server service
  server:
    build:
      context: ./src
      dockerfile: ServerCpp/Dockerfile
    entrypoint: ["./ServerCpp"]
    command: ["3782"]
    ports:
      - "3782:3782"
    volumes:
      - ./data:/usr/src/data
    environment:
      - EX1_DIR=/usr/src/data
    networks:
      - local

  # Node.js server
  server_node:
    build:
      context: ./src/server_database
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:

      - ./uploads:/usr/src/app/uploads
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=project-exercise1
    networks:
      - local
    depends_on:
      - server
      - mongo


  # Python client connecting to C++ server
  client_python:
    build:
      context: ./src/ClientPython
      dockerfile: Dockerfile
    entrypoint: ["python3", "TCP_Client.py"]
    command: ["server", "3782"]
    depends_on:
      - server
    networks:
      - local
    stdin_open: true
    tty: true

  # C++ client connecting to C++ server
  client_cpp:
    build:
      context: ./src/ClientCpp
      dockerfile: Dockerfile
    entrypoint: ["./tcp_c"]
    command: ["server", "3782"]
    depends_on:
      - server
    networks:
      - local
    stdin_open: true
    tty: true

    #React app (npm start)
  react_app:
    build:
      context: ./react_app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - ./react_app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - local
    depends_on:
      - server_node

  mongo:
    image: mongo:latest
    command:
      - mongod
      - --quiet
      - --logpath
      - /dev/null
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - local

  mobile_app:
    build:
      context: ./react_native_app 
      dockerfile: Dockerfile
    container_name: mobile_app_container
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - ./react_native_app/.env
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://10.0.2.2:8080}
    networks:
      - local
    stdin_open: true
    tty: true
    attach: true
    command: /bin/sh -c "npx expo start --tunnel"
    depends_on:
      - server_node




volumes:
  mongo_data:

# Custom network for all services
networks:
  local:
    driver: bridge
