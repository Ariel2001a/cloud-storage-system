<html>
<head>

  <link rel="stylesheet" href="reg_log.css">
  

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 
    
    <style>
   
body {
  background-color: rgb(36, 36, 36);
}

    </style>

<head>



<body>



<div class="MyCard">

   <img src="../../images/Alogo.png" alt="Logo" class="card-logo">


<h2 
class="main_headline">Create a new account


</h2>


<h3 
class="secondary_headline">Already has an account?
</h3>

<button class="btn btn-primary" type="submit">Register</button>


<input class="btn btn-light" type="button" value="Sign in">

<div id="firstname">
  
  <input type="text" class="form-control" placeholder="First name" aria-label="Username" aria-describedby="addon-wrapping" id="First name" required>

</div>

<div id="lastname">
  
  <input type="text" class="form-control" placeholder="Last name" aria-label="Username" aria-describedby="addon-wrapping" id="Last name" required>

</div>
  <label for="profilePic" class="photo-placeholder">
    Upload Picture
  </label>
  <input type="file" id="profilePic" name="profilePic" accept="image/*" style="display:none;">
  
  

<div id="username">
  
  <input type="username" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="addon-wrapping" id="username" required>

</div>
<div id="password">
  
  <input type="password" class="form-control" placeholder="Password" aria-label="Username" aria-describedby="addon-wrapping" id="password" required>

</div>



</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>


















</html>
